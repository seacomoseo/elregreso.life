- title: Casa Marabella
  subtitle: Una casa con encanto y alma, base de la comunidad
  image: /casa.jpg
  md: |
    Marabella es el nombre que le pusieron a la casa los promotores, y como bien sugiere este, es una maravilla, no solo por el encanto que tiene sino por el alma que le dieron en su construcción.

    Tiene muchos detalles y mucho amor puesto en ella.

    Un rasgo importante es la finalidad para la cual se creó, ya que esta está destinada a tener un uso comunitario.

    Es el centro neurálgico de la comunidad puesto que su equipamiento es de uso compartido, ya sea la cocina, la biblioteca, el lavadero, el almacén y la sala de actividades o ludoteca.

    Además, una característica recalcable es que dispone de dos baños con váter seco, algo imprescindible para seguir los principios de la comunidad, y es que aquí procuramos gestionar nuestros desechos con sumo cuidado.

    Se pretende que sea lo más autosuficiente posible; el agua llega a la casa por dos vías, una es la recolectada de lluvia y la otra es la que viene por manguera desde una arqueta que recoge el agua que brota de un manantial, y la electricidad la generan paneles solares.
  view: ''
  sort: ''
